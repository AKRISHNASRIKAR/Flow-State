<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Same mark as components/Logo.tsx, on an indigo tile so it reads on both
       light and dark browser chrome. Stroke is heavier than the in-app mark
       because a favicon renders at 16px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#tile)" />
  <g transform="translate(16 16) scale(1.12) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5h9.5a3.5 3.5 0 0 1 0 7H10a3.5 3.5 0 0 0 0 7H20" />
    <circle cx="4" cy="5" r="2.5" fill="#fff" stroke="none" />
    <circle cx="20" cy="19" r="2.5" fill="#fff" stroke="none" />
  </g>
</svg>
