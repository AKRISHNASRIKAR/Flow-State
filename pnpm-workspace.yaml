packages:
  - backend
  - frontend
  - worker
  - packages/*

onlyBuiltDependencies:
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - workerd
  - '@tailwindcss/oxide'
  - '@nestjs/core'

# Security fixes for transitive packages whose parents still pin older releases.
# Keep these scoped to affected versions; remove them once upstream catches up.
overrides:
  'postcss@<8.5.23': '8.5.28'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'qs@<6.16.0': '6.16.0'
  'proxy-addr@<2.0.8': '2.0.8'
  'source-map-js@<1.2.2': '1.2.2'
  'sharp@>=0.35.0 <0.35.5': '0.35.5'
  '@prisma/config>deepmerge-ts': '8.0.2'
  'fast-uri@<3.1.8': '3.1.8'
  'brace-expansion@>=1.0.0 <2.0.0': '1.1.21'
  'brace-expansion@>=2.0.0 <3.0.0': '2.1.7'
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'
  'undici@>=7.0.0 <7.29.1': '7.29.1'
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'browserslist@<4.28.7': '4.28.7'
  'baseline-browser-mapping@<2.11.0': '2.11.0'
  'handlebars@<4.7.10': '4.7.10'
